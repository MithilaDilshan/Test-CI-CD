name: Cypress CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  cypress-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress API tests
        uses: cypress-io/github-action@v6
        with:
          browser: electron
          config: baseUrl=${{ env.CYPRESS_BASE_URL }}
          record: false
        env:
          CYPRESS_BASE_URL: https://test.mycompany.com
          CYPRESS_API_USER: ${{ secrets.API_USER }}
          CYPRESS_API_PASS: ${{ secrets.API_PASS }}
