name: Cypress CI Pipeline

on:
  push:
    branches: [master]
  pull_request:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cypress-io/github-action@v6
        with:
          command: npx cypress run --spec cypress/e2e/API/login.api.cy.js
        env:
          CYPRESS_BASE_URL: https://dummyjson.com
          CYPRESS_API_USER: ${{ secrets.API_USER_NAME }}
          CYPRESS_API_PASS: ${{ secrets.API_PASSWORD }}

      - name: Upload API Report
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report
          path: cypress/reports

  ui-tests:
    needs: api-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cypress-io/github-action@v6
        with:
          command: npx cypress run --spec cypress/e2e/CI/ci-smoke.cy.js
        env:
          CYPRESS_URL_SMOKE: https://example.cypress.io

      - name: Upload UI Report
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-report
          path: cypress/reports
