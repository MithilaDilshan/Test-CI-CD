name: API Tests CI

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress API tests
        uses: cypress-io/github-action@v6
        with:
          browser: electron
          record: false
        env:
          CYPRESS_BASE_URL: https://dummyjson.com
          CYPRESS_API_USER_NAME: ${{ secrets.API_USER_NAME }}
          CYPRESS_API_PASSWORD: ${{ secrets.API_PASSWORD }}
